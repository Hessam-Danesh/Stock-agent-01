
name: Build Iran Stock Agent APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Reassemble project archive
        shell: bash
        run: |
          set -e

          test -f iran_stock_agent_android_v029_part1_three.bin
          test -f iran_stock_agent_android_v029_part2_three.bin
          test -f iran_stock_agent_android_v029_part3_three.bin

          cat \
            iran_stock_agent_android_v029_part1_three.bin \
            iran_stock_agent_android_v029_part2_three.bin \
            iran_stock_agent_android_v029_part3_three.bin \
            > project.zip

          unzip -t project.zip

          mkdir -p project
          unzip -q project.zip -d project

          echo "Archive extracted successfully."
          echo "Project files:"
          ls -la project

          test -f project/buildozer.spec
          test -f project/main.py

      - name: Install build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            cmake \
            libffi-dev \
            libssl-dev \
            build-essential \
            libltdl-dev

          python -m pip install --upgrade pip setuptools wheel

          python -m pip install \
            buildozer==1.5.0 \
            cython==0.29.36

      - name: Verify Android project structure
        working-directory: project
        run: |
          set -e

          echo "Checking Buildozer configuration..."

          test -f buildozer.spec
          test -f main.py
          test -d assets

          echo "Buildozer configuration found."
          echo "Current requirements:"
          grep -n '^requirements' buildozer.spec || true

      - name: Upgrade Kivy
        working-directory: project
        shell: bash
        run: |
          set -e

          if grep -q 'kivy==2.3.0' buildozer.spec; then
            sed -i 's/kivy==2.3.0/kivy==2.3.2/g' buildozer.spec
          fi

          echo "Updated requirements:"
          grep '^requirements' buildozer.spec

      - name: Build APK
        working-directory: project
        env:
          BUILDOZER_WARN_ON_ROOT: "0"
        run: |
          set -e

          buildozer android debug

      - name: Verify APK
        shell: bash
        run: |
          set -e

          echo "Searching for generated APK..."

          find project/bin -maxdepth 1 -type f -name "*.apk" -print

          test -n "$(find project/bin -maxdepth 1 -type f -name '*.apk' -print -quit)"

          echo "APK successfully generated."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: iran-stock-agent-apk
          path: project/bin/*.apk
          if-no-files-found: error
          retention-days: 14
