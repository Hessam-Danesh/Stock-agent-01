
name: Build Iran Stock Agent APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Reassemble project archive
        run: |
          cat iran_stock_agent_android_v029_part1.bin iran_stock_agent_android_v029_part2.bin > project.zip
          unzip -t project.zip
          mkdir project
          unzip -q project.zip -d project

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf automake autopoint gettext \
            libtool libtool-bin pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo6 cmake libffi-dev libssl-dev curl

          python -m pip install --upgrade pip
          python -m pip install buildozer==1.5.0 cython==0.29.36

      - name: Create NumPy constraints
        run: |
          mkdir -p project/iran_stock_android/p4a-recipes/pandas
          echo "numpy==2.3.3" > project/iran_stock_android/p4a-recipes/pandas/build-constraints.txt

      - name: Create compatible NumPy recipe
        working-directory: project/iran_stock_android
        run: |
          mkdir -p p4a-recipes/numpy

          cat > p4a-recipes/numpy/__init__.py <<'PY'
          from pythonforandroid.recipe import Recipe, MesonRecipe
          from os.path import join
          import shutil

          class NumpyRecipe(MesonRecipe):
              version = "v2.3.3"
              url = "git+https://github.com/numpy/numpy"
              extra_build_args = [
                  "-Csetup-args=-Dblas=none",
                  "-Csetup-args=-Dlapack=none"
              ]
              opt_depends = ["libopenblas"]
              need_stl_shared = True
              min_ndk_api_support = 24

              def get_include(self, arch):
                  return join(
                      self.ctx.get_python_install_dir(arch.arch),
                      "numpy/_core/include",
                  )

              def get_recipe_meson_options(self, arch):
                  options = super().get_recipe_meson_options(arch)
                  options["properties"]["longdouble_format"] = (
                      "IEEE_DOUBLE_LE"
                      if arch.arch in ["armeabi-v7a", "x86"]
                      else "IEEE_QUAD_LE"
                  )
                  return options

              def get_recipe_env(self, arch, **kwargs):
                  env = super().get_recipe_env(arch, **kwargs)
                  env["_PYTHON_HOST_PLATFORM"] = arch.command_prefix
                  env["NPY_DISABLE_SVML"] = "1"

                  env["TARGET_PYTHON_EXE"] = join(
                      Recipe.get_recipe("python3", self.ctx)
                      .get_build_dir(arch.arch),
                      "android-build",
                      "python",
                  )

                  return env

              def get_hostrecipe_env(self, arch=None):
                  env = super().get_hostrecipe_env(arch=arch)
                  env["RANLIB"] = shutil.which("ranlib")
                  return env

          recipe = NumpyRecipe()
          PY

      - name: Create compatible Pandas recipe
        working-directory: project/iran_stock_android
        run: |
          mkdir -p p4a-recipes/pandas

          cat > p4a-recipes/pandas/__init__.py <<'PY'
          from os.path import join
          from pythonforandroid.recipe import MesonRecipe
          import os

          class PandasRecipe(MesonRecipe):
              version = "v2.3.3"
              url = "git+https://github.com/pandas-dev/pandas"
              depends = ["numpy", "libbz2", "liblzma"]

              hostpython_prerequisites = [
                  "versioneer[toml]",
                  "numpy==2.3.3",
                  "Cython<4.0.0a0"
              ]

              patches = ["fix_numpy_includes.patch"]
              python_depends = ["python-dateutil", "pytz"]
              need_stl_shared = True

              def get_recipe_env(self, arch, **kwargs):
                  env = super().get_recipe_env(arch, **kwargs)

                  constraints = join(
                      os.environ["GITHUB_WORKSPACE"],
                      "project",
                      "iran_stock_android",
                      "p4a-recipes",
                      "pandas",
                      "build-constraints.txt"
                  )

                  env["PIP_CONSTRAINT"] = constraints
                  env["PIP_BUILD_CONSTRAINT"] = constraints

                  env["NUMPY_INCLUDES"] = join(
                      self.ctx.get_python_install_dir(arch.arch),
                      "numpy/_core/include",
                  )

                  env["PYTHON_INCLUDE_DIR"] = (
                      self.ctx.python_recipe.include_root(arch)
                  )

                  env["LDFLAGS"] += (
                      f" -landroid -l{self.stl_lib_name}"
                  )

                  return env

              def build_arch(self, arch):
                  super().build_arch(arch)
                  self.restore_hostpython_prerequisites(["cython"])

          recipe = PandasRecipe()
          PY

          curl -L --fail \
            https://raw.githubusercontent.com/kivy/python-for-android/develop/pythonforandroid/recipes/pandas/fix_numpy_includes.patch \
            -o p4a-recipes/pandas/fix_numpy_includes.patch

          python - <<'PY'
          from pathlib import Path
          p = Path("buildozer.spec")
          s = p.read_text()
          if "p4a.local_recipes" not in s:
              s = s.replace(
                  "[app]",
                  "[app]\np4a.local_recipes = p4a-recipes",
                  1
              )
          p.write_text(s)
          PY

          sed -i 's/,lxml//g' buildozer.spec

          echo "Pandas constraints:"
          cat p4a-recipes/pandas/build-constraints.txt

      - name: Build APK
        working-directory: project/iran_stock_android
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: iran-stock-agent-apk
          path: project/iran_stock_android/bin/*.apk
          if-no-files-found: error
          retention-days: 14
