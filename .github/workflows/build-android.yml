
name: Build Iran Stock Agent APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Reassemble project archive
        run: |
          cat iran_stock_agent_android_v029_part1.bin iran_stock_agent_android_v029_part2.bin > project.zip
          unzip -t project.zip
          mkdir project
          unzip -q project.zip -d project

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 \
            cmake libffi-dev libssl-dev
          python -m pip install --upgrade pip
          python -m pip install buildozer==1.5.0 cython==0.29.36

      - name: Build APK
        working-directory: project/iran_stock_android
        run: buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: iran-stock-agent-apk
          path: project/iran_stock_android/bin/*.apk
          if-no-files-found: error
          retention-days: 14
